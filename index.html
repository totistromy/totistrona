<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toti Strona - Nowoczesne Strony Internetowe</title>
</head>
<body>

  <section id="kontakt">
    <h2>Złóż zapytanie</h2>
    <form action="https://api.web3forms.com/submit" method="POST">
      <!-- Twój klucz dostępu Web3Forms -->
      <input type="hidden" name="access_key" value="003d3d3e-9b83-4aae-83cb-93b584eb25e4">
      
      <!-- Temat wiadomości, który zobaczysz w swojej skrzynce pocztowej -->
      <input type="hidden" name="subject" value="Nowe zapytanie ze strony Toti Strona!">

      <div>
        <label for="name">Imię i nazwisko</label>
        <input type="text" id="name" name="name" required>
      </div>
      
      <div>
        <label for="email">E-mail klienta</label>
        <input type="email" id="email" name="email" required>
      </div>
      
      <div>
        <label for="message">Opis projektu / Czego potrzebujesz?</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>

      <button type="submit">Złóż zapytanie</button>
    </form>
  </section>

</body>
</html>
